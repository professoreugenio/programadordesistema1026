<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="adicionar">Adicionar</button>
    <button id="limpar">Limpar</button>
    <h2 id="contador">0</h2>

    <script>
    let contador =0
     const btadd = document.querySelector("#adicionar")
     const btlimpar = document.querySelector("#limpar")
     const retorno = document.querySelector("#contador")

     btadd.addEventListener("click", ()=>{
        contador++
        retorno.textContent = "cliques " + contador
        
     })
     btlimpar.addEventListener("click", ()=>{
        contador = 0
        retorno.textContent = contador + " cliques"
     })
    </script>
</body>
</html>
