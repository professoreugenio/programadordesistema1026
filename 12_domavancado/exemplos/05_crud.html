<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Produtos</title>
    <link rel="stylesheet" href="stylecrud.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav>
        <a href="01_valores.html">Valores</a>
        <a href="02_captura.html">Captura</a>
        <a href="02_submit.html">Submite</a>
        <a href="03_lista.html">Lista 1</a>
        <a href="04_lista.html">Lista valida</a>
        <a href="05_crud.html">Crud</a>
        <a href="06_storage.html">Storage</a>
    </nav>
    <main class="container">
        <h1>Cadastro de Produtos</h1>
        <section class="formulario">
            <h2>Dados do Produto</h2>
            <form id="formProduto">
                <div class="campos">
                    <div>
                        <label for="codigo">Código</label>
                        <input type="number" id="codigo" min="1" step="1" required>
                    </div>
                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div>
                        <label for="preco">Preço</label>
                        <input type="number" id="preco" min="0" step="0.01" required>
                    </div>
                    <div>
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" min="0" step="1" required>
                    </div>
                    <div>
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="">Selecione</option>
                            <option>Periférico</option>
                            <option>Monitor</option>
                            <option>Computador</option>
                            <option>Outros</option>
                        </select>
                    </div>
                </div>
                <div class="botoes">
                    <button type="submit" id="salvar">
                        Cadastrar Produto
                    </button>
                    <button type="reset" id="cancelar">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>
        <section class="produtos">
            <h2>Produtos Cadastrados</h2>
            <input type="search" id="pesquisa" placeholder="Pesquisar produto...">
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Qtd.</th>
                            <th>Categoria</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
            <div class="resumo">
                <p>Produtos: <strong id="totalProdutos">0</strong></p>
                <p>Estoque: <strong id="valorEstoque">R$ 0,00</strong></p>
            </div>
        </section>
    </main>
</body>
</html>
